name: Bug report
description: Something behaved differently than documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Please **do not paste the contents of your `.timeloom/` store** —
        it contains full copies of your source files, which may include secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. timeloom init
        2. timeloom watch
        3. edit src/foo.ts
        4. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: timeloom version
      description: Output of `timeloom --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Re-run with `--log-level debug` and paste the output. Redact anything sensitive.
      render: shell
